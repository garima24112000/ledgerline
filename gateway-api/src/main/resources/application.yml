server:
  port: 8080

spring:
  application:
    name: gateway-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledgerline}
    username: ${DB_USERNAME:ledgerline}
    password: ${DB_PASSWORD:ledgerline}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, Hibernate only checks it
  flyway:
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
