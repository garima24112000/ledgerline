server:
  port: 8080

spring:
  application:
    name: gateway-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledgerline}
    username: ${DB_USERNAME:ledgerline}
    password: ${DB_PASSWORD:ledgerline}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, Hibernate only checks it
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 100ms # a slow Redis delays each request by at most this, then the limiter fails open
      connect-timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all # wait for every in-sync replica, so an acked event survives a broker loss
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true # producer retries can't write the same record twice
        delivery.timeout.ms: 10000 # upper bound on how long the relay holds its row locks
        request.timeout.ms: 5000
        max.block.ms: 5000 # don't hang forever when the broker is down
        linger.ms: 5

gateway:
  bank:
    base-url: ${BANK_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s # no answer by then -> the payment is UNKNOWN
  idempotency:
    lock-ttl: 10s # must exceed the slowest request (bounded by the bank read timeout)
  reconciler:
    enabled: ${RECONCILER_ENABLED:true}
    interval: PT10S # ISO-8601, because @Scheduled reads it as a Duration
    min-age: 5s
    batch-size: 100
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    interval: PT0.2S
    batch-size: 100
    topic: payment.events
    partitions: 6
    replicas: ${KAFKA_REPLICATION_FACTOR:1}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    tiers:
      FREE:
        rate-per-second: 20
        burst: 40
      PRO:
        rate-per-second: 200
        burst: 400
  auth:
    # Dev defaults only. Set these from secrets in any real deployment.
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin-dev-password}
    service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-service-token}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false # the rate limiter fails open, so Redis being down must not make the pod unhealthy
  metrics:
    tags:
      application: ${spring.application.name}
