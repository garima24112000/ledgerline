{{- if .Values.ingress.enabled }}
{{- $ctx := dict "root" $ "component" "gateway-api" }}
{{- /* allowedCidrs: a list, or a comma-separated string; blanks are dropped. */ -}}
{{- $cidrs := list }}
{{- $raw := .Values.ingress.allowedCidrs | default list }}
{{- if kindIs "string" $raw }}{{ $raw = splitList "," $raw }}{{ end }}
{{- range $raw }}{{ if trim . }}{{ $cidrs = append $cidrs (trim .) }}{{ end }}{{ end }}
{{- if .Values.ingress.requireAllowedCidrs }}
{{- if not $cidrs }}
{{- fail "ingress.allowedCidrs is required: this Ingress is plain HTTP, so API keys and admin credentials must not be reachable from the whole internet. Pass your public IP, e.g. --set 'ingress.allowedCidrs={203.0.113.7/32}'" }}
{{- end }}
{{- range $cidrs }}
{{- if has . (list "0.0.0.0/0" "::/0") }}
{{- fail (printf "ingress.allowedCidrs must not contain %s: this Ingress is plain HTTP; allow only your own IP (x.x.x.x/32)" .) }}
{{- end }}
{{- end }}
{{- end }}
# Public entry point: only gateway-api is exposed. The dispatcher, bank and merchant stay internal.
# (Grafana's Ingress comes from kube-prometheus-stack values: it lives in the monitoring namespace.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ledgerline.name" $ctx }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
  {{- if or .Values.ingress.annotations $cidrs }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $cidrs }}
    {{- /* Source-IP allow-list, in the syntax of the controller that serves this class. */}}
    {{- if eq .Values.ingress.className "alb" }}
    alb.ingress.kubernetes.io/inbound-cidrs: {{ join "," $cidrs | quote }}
    {{- else }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," $cidrs | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
    {{- else }}
    # No host: match any Host header (on EKS, the ALB's own DNS name; there is no domain).
    - http:
    {{- end }}
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ledgerline.name" $ctx }}
                port:
                  name: http
{{- end }}
