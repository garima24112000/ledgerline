{{- if .Values.kafka.enabled }}
{{- $ctx := dict "root" $ "component" "kafka" }}
{{- $name := include "ledgerline.name" $ctx }}
# Single-node KRaft Kafka (broker + controller in one process) for demos, same settings as
# docker-compose. Production: Amazon MSK with 3 brokers and KAFKA_REPLICATION_FACTOR=3, kafka.enabled=false.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  # The broker advertises this DNS name, and its own readiness probe connects through it. Without
  # this the name only resolves once the pod is ready, and the pod would never become ready.
  publishNotReadyAddresses: true
  selector:
    {{- include "ledgerline.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ledgerline.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledgerline.labels" $ctx | nindent 8 }}
    spec:
      # Kubernetes would otherwise inject <SERVICE>_PORT=tcp://... variables, and the image turns
      # every KAFKA_* variable into broker config.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000 # the image runs as appuser (uid 1000); it must own the data volume
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # Clients connect to whatever address the broker advertises, so it must be a name
            # every pod can resolve: the Service name.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://{{ $name }}:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # A subdirectory: a fresh EBS volume's root has lost+found, which Kafka would treat as a partition.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.kafka.heapOpts | quote }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
{{- end }}
