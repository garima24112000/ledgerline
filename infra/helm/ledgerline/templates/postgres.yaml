{{- if .Values.postgres.enabled }}
{{- $ctx := dict "root" $ "component" "postgres" }}
# Single Postgres pod for demos. Production: Amazon RDS (Multi-AZ, backups, PITR), postgres.enabled=false.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ledgerline.name" $ctx }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None # headless: gives the StatefulSet pod a stable DNS name
  selector:
    {{- include "ledgerline.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ledgerline.name" $ctx }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ include "ledgerline.name" $ctx }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ledgerline.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledgerline.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ledgerline.secretName" . }}
                  key: DB_PASSWORD
            # A subdirectory: the volume's root may contain lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
