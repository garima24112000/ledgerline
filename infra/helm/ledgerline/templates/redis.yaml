{{- if .Values.redis.enabled }}
{{- $ctx := dict "root" $ "component" "redis" }}
# Single Redis pod for demos. Production: Amazon ElastiCache, redis.enabled=false.
# No volume: Redis only holds rate-limit token buckets, which refill within seconds, and the
# limiter fails open while Redis is down. Persisting them would buy nothing.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ledgerline.name" $ctx }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ledgerline.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ledgerline.name" $ctx }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ include "ledgerline.name" $ctx }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ledgerline.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledgerline.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
