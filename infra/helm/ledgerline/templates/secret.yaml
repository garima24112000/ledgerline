{{- if not .Values.secrets.existingSecret }}
{{- $ctx := dict "root" $ "component" "secrets" }}
# Created from values. On EKS set secrets.existingSecret instead and manage the Secret outside Helm.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledgerline.secretName" . }}
  labels:
    {{- include "ledgerline.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword is required (or set secrets.existingSecret)" .Values.secrets.dbPassword | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (or set secrets.existingSecret)" .Values.secrets.adminPassword | quote }}
  INTERNAL_SERVICE_TOKEN: {{ required "secrets.internalServiceToken is required (or set secrets.existingSecret)" .Values.secrets.internalServiceToken | quote }}
{{- end }}
