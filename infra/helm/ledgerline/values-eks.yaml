# =============================================================================================
# EKS (Phase 9): the cluster, RDS, ECR and the rest come from infra/terraform.
#
#   Postgres  -> Amazon RDS for PostgreSQL 16 (postgres.enabled=false, external.databaseUrl).
#   Redis     -> STILL an in-cluster StatefulSet. Demo scaffolding, not the production design.
#   Kafka     -> STILL an in-cluster StatefulSet (1 broker, gp3 EBS volume). Demo scaffolding.
#
# Why Redis and Kafka stay in-cluster: Phase 9 provisions only RDS. ElastiCache and MSK would also
# need app changes (Redis TLS/AUTH, Kafka TLS or IAM auth), which the chart and apps don't have yet.
# The money lives in RDS: the ledger, and the outbox that can republish every event to Kafka.
# See docs/DESIGN.md, "AWS (Phase 9)".
#
# Set by .github/workflows/deploy.yml on every deploy (never committed here):
#   image.repository, image.tag, external.databaseUrl, ingress.allowedCidrs
# =============================================================================================

# Pushed by deploy.yml as <registry>/ledgerline/<app>:<git sha>, built on GitHub's amd64 runners.
image:
  repository: set-by-deploy # <account-id>.dkr.ecr.us-east-1.amazonaws.com/ledgerline
  tag: set-by-deploy        # the git commit SHA
  pullPolicy: IfNotPresent

# Created by scripts/aws-up.sh from SSM SecureStrings that Terraform wrote. Keys DB_PASSWORD,
# ADMIN_PASSWORD, INTERNAL_SERVICE_TOKEN. The chart creates no Secret. Changing it does not roll the
# pods (the checksum only covers chart-made Secrets): kubectl -n ledgerline rollout restart deploy.
secrets:
  existingSecret: ledgerline-secrets

# Non-default StorageClass created by scripts/aws-up.sh (EBS CSI driver, gp3, encrypted).
# Only Kafka's volume uses it.
storageClass: gp3

# AWS Load Balancer Controller -> an internet-facing ALB. Plain HTTP: there is no domain or ACM
# certificate in Phase 9, so the ALB only accepts the source CIDRs in allowedCidrs, and the chart
# refuses to render without them (or with 0.0.0.0/0). Production fix: Route 53 + ACM + HTTPS listener.
ingress:
  className: alb
  host: "" # no domain: match the ALB's own DNS name
  requireAllowedCidrs: true
  allowedCidrs: [] # deploy.yml: --set "ingress.allowedCidrs={<your-ip>/32}" from vars.INGRESS_ALLOWED_CIDRS
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # straight to pod IPs (VPC CNI), no NodePort hop
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"

gatewayApi:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 1536Mi }
  hpa:
    minReplicas: 2
    # 4, not 6: 3 x c7i-flex.large have ~9.2 GiB allocatable in total, shared with Kafka, the other apps
    # and monitoring. 6 gateway pods at 1 GiB each would sit Pending.
    maxReplicas: 4

webhookDispatcher:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 1536Mi }

# --- Postgres: Amazon RDS ----------------------------------------------------------------------
postgres:
  enabled: false
  # Still the source of DB_USERNAME for the apps: must equal the RDS master username (rds.tf).
  username: ledgerline

external:
  # Set by deploy.yml from SSM /ledgerline/deploy/database-url, e.g.
  # jdbc:postgresql://ledgerline.xxxx.us-east-1.rds.amazonaws.com:5432/ledgerline?sslmode=require
  # Left empty here, so a deploy without it fails at render time ("external.databaseUrl is required").
  databaseUrl: ""

# --- Redis and Kafka: still in-cluster (see header) ---------------------------------------------
kafka:
  storage: 10Gi

# --- Future, NOT Phase 9: ElastiCache and MSK ------------------------------------------------------
# Needs Terraform for both, plus app support for Redis TLS/AUTH and Kafka TLS/IAM first.
# redis:
#   enabled: false
# kafka:
#   enabled: false
# external:
#   redisHost: <elasticache-primary-endpoint>
#   kafkaBootstrapServers: <msk-broker-1>:9094,<msk-broker-2>:9094,<msk-broker-3>:9094
# config:
#   kafkaReplicationFactor: 3
