# Local Kubernetes for Ledgerline: 1 control plane + 2 workers.
#   kind create cluster --config infra/k8s/kind-config.yaml   (scripts/kind-up.sh does this)
#
# ingress-nginx runs on the control-plane node (label ingress-ready=true) with hostPorts 80/443,
# and these port mappings publish them on the laptop. So http://api.localtest.me reaches the Ingress
# (*.localtest.me resolves to 127.0.0.1, no /etc/hosts edits needed).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ledgerline
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
