server:
  port: 8082

spring:
  application:
    name: mock-bank
  threads:
    virtual:
      enabled: true

# Each charge is approved, declined, or "times out" (the decision is stored, then the
# response is delayed past the gateway's 2s read timeout). The three rates must sum to 1.
# BANK_TIMEOUTS_ENABLED=false (load tests) answers the timeout bucket on time instead.
bank:
  approve-rate: ${BANK_APPROVE_RATE:0.85}
  decline-rate: ${BANK_DECLINE_RATE:0.10}
  timeout-rate: ${BANK_TIMEOUT_RATE:0.05}
  latency-min: ${BANK_LATENCY_MIN:50ms}
  latency-max: ${BANK_LATENCY_MAX:300ms}
  timeout-sleep: ${BANK_TIMEOUT_SLEEP:5s}
  timeouts-enabled: ${BANK_TIMEOUTS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true # buckets, so Grafana can aggregate p50/p95/p99 across instances
  tracing:
    sampling:
      probability: 1.0 # no exporter is configured; tracing only supplies traceId/spanId for logs and propagation
