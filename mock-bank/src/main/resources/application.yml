server:
  port: 8082

spring:
  application:
    name: mock-bank
  threads:
    virtual:
      enabled: true

# Each charge is approved, declined, or "times out" (the decision is stored, then the
# response is delayed past the gateway's 2s read timeout). The three rates must sum to 1.
bank:
  approve-rate: ${BANK_APPROVE_RATE:0.85}
  decline-rate: ${BANK_DECLINE_RATE:0.10}
  timeout-rate: ${BANK_TIMEOUT_RATE:0.05}
  latency-min: ${BANK_LATENCY_MIN:50ms}
  latency-max: ${BANK_LATENCY_MAX:300ms}
  timeout-sleep: ${BANK_TIMEOUT_SLEEP:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
